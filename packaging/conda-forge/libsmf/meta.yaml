{% set name = "libsmf" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/danlil240/opt_solver/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ad36380e3dc73a99e83f8afa3723bc1b809e03a8020c688d2ae0ba492c488480

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('libsmf', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.20
    - ninja
    - pkg-config
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  host:
    - blas-devel
    - libblas
    - liblapack
    - libcblas
    - suitesparse

test:
  requires:
    - pkg-config
  commands:
    - pkg-config --exists --exact-version={{ version }} smf          # [unix]
    - test -f "${PREFIX}/include/smf/smf_c.h"                        # [unix]
    - test -f "${PREFIX}/lib/libsmf_c${SHLIB_EXT}"                   # [unix]
    - test -f "${PREFIX}/lib/libsmf_ma97${SHLIB_EXT}"                # [unix]
    - if not exist "%LIBRARY_INC%\\smf\\smf_c.h" exit 1              # [win]
    - if not exist "%LIBRARY_BIN%\\smf_c.dll" exit 1                 # [win]
    - if not exist "%LIBRARY_BIN%\\smf_ma97.dll" exit 1              # [win]

about:
  home: https://github.com/danlil240/opt_solver
  license: MIT AND Apache-2.0
  license_family: MIT
  license_file:
    - LICENSE
    - solver/third_party/LICENSE-Apache-2.0.txt
    - solver/third_party/README.md
  summary: Sparse symmetric multifrontal direct linear solver (Cholesky / LDL^T) for IPOPT and KKT systems
  description: |
    smf is a C++20 sparse symmetric multifrontal direct solver designed for
    interior-point optimizers (IPOPT, CasADi, cyipopt, JuMP/MadNLP). It ships
    a versioned C ABI (libsmf_c, pkg-config smf) for native linear_solver=smf
    integration as well as a drop-in HSL MA97 plugin (libsmf_ma97).

extra:
  recipe-maintainers:
    - danlil240
